<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf8fc"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff2e8"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35c2d6"/><stop offset="1" stop-color="#087fbd"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffab72"/><stop offset="1" stop-color="#f47b42"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#dff6fb" stop-opacity=".72"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#0b2d4d" flood-opacity=".18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1000" height="700" rx="56" fill="url(#bg)"/>
<circle cx="830" cy="95" r="120" fill="#35c2d6" opacity=".18" filter="url(#soft)"/>
<circle cx="130" cy="595" r="150" fill="#f47b42" opacity=".14" filter="url(#soft)"/>
<!-- isometric platform -->
<g filter="url(#shadow)">
 <path d="M180 470 L500 290 L825 470 L500 650 Z" fill="#dceff5"/>
 <path d="M180 470 L500 650 L500 676 L180 496 Z" fill="#a9d8e8"/>
 <path d="M500 650 L825 470 L825 496 L500 676 Z" fill="#74bdd6"/>
</g>
<!-- house -->
<g filter="url(#shadow)">
 <path d="M320 420 L500 315 L680 420 L500 525 Z" fill="#fff"/>
 <path d="M320 420 L500 525 L500 600 L320 495 Z" fill="#eaf6fa"/>
 <path d="M500 525 L680 420 L680 495 L500 600 Z" fill="#c9e8f1"/>
 <path d="M295 405 L500 285 L705 405 L500 525 Z" fill="url(#blue)"/>
 <path d="M295 405 L500 525 L500 548 L295 428 Z" fill="#0871a7"/>
 <path d="M500 525 L705 405 L705 428 L500 548 Z" fill="#065b89"/>
 <rect x="430" y="458" width="70" height="110" rx="8" fill="#0b2d4d"/>
 <rect x="535" y="435" width="72" height="55" rx="9" fill="#bff0f7" stroke="#fff" stroke-width="7"/>
</g>
<!-- AC outdoor unit -->
<g transform="translate(650 425)" filter="url(#shadow)">
 <rect x="0" y="0" width="150" height="112" rx="20" fill="url(#glass)" stroke="#fff" stroke-width="5"/>
 <circle cx="55" cy="55" r="34" fill="#d9edf3" stroke="#087fbd" stroke-width="7"/>
 <circle cx="55" cy="55" r="8" fill="#0b2d4d"/>
 <path d="M55 22 C78 35 81 52 60 56 C38 60 31 43 55 22M88 55 C75 78 58 81 54 60 C50 38 67 31 88 55M55 88 C32 75 29 58 50 54 C72 50 79 67 55 88" fill="#35c2d6" opacity=".75"/>
 <rect x="105" y="30" width="28" height="8" rx="4" fill="#087fbd"/><rect x="105" y="46" width="28" height="8" rx="4" fill="#9bcbd9"/>
</g>
<!-- water / heating bubbles -->
<g filter="url(#shadow)">
 <circle cx="225" cy="265" r="72" fill="url(#glass)"/>
 <path d="M225 210 C188 260 188 282 225 305 C262 282 262 260 225 210Z" fill="url(#blue)"/>
 <circle cx="800" cy="230" r="72" fill="url(#glass)"/>
 <path d="M802 180 C770 225 782 243 802 251 C822 243 834 225 802 180M780 238 C755 272 764 286 780 292 C797 286 806 272 780 238M824 238 C799 272 808 286 824 292 C841 286 850 272 824 238" fill="url(#orange)"/>
</g>
<!-- floating tools -->
<g filter="url(#shadow)">
 <rect x="105" y="365" width="140" height="62" rx="24" fill="#fff"/>
 <path d="M135 396 h58" stroke="#087fbd" stroke-width="12" stroke-linecap="round"/><circle cx="202" cy="396" r="12" fill="#f47b42"/>
 <rect x="755" y="345" width="145" height="62" rx="24" fill="#fff"/>
 <path d="M790 376 l22 22 l48-48" fill="none" stroke="#35c2d6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="500" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="46" fill="#0b2d4d">Confort • Énergie • Habitat</text>
<text x="500" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#087fbd">Une expertise complète, du dépannage à l’installation</text>
</svg>